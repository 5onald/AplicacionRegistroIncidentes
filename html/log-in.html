<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instacredit | Log in</title>
    <link rel="icon" type="image/png" href="https://www.instacredit.com/wp-content/uploads/2020/06/cropped-favicon2.png">
    <link rel="stylesheet" href="../css/log-in.css">
    <link rel="stylesheet" href="../css/root.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section class="white-section">
            <div>
                <img src="../img/instacredit1.png" alt="Instacredit-logo">
            </div>
            <div>
                <h1>¡Bienvenido a Registro de Incidentes Instacredit!</h1>
                <form id="login-form">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="example@instacredit.com" autocomplete="username" required>
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <label for="recordar"><input type="checkbox" id="recordar" name="recordar">Remember Me</label>
                    <button type="submit">Iniciar sesión</button>
                </form>
            </div>
            <div>
                <p>Al presionar “Iniciar sesión” estás de acuerdo con</p>
                <p><a href="https://www.instacredit.com/terminos_condiciones/">Términos de servicio</a> | <a href="https://www.instacredit.com/politicas_privacidad/">Políticas de privacidad</a></p>
            </div>
        </section>

        <section class="blue-section">
            <div>
                <img src="https://www.instacredit.com/wp-content/uploads/2024/06/Prestamito-Condiciones@2x.webp" alt="Prestamito-pulga-hacia-arriba">
            </div>
        </section>
    </main>
</body>
</html>
